<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background:
      radial-gradient(540px 420px at 22% 48%, rgba(0,194,168,0.24), rgba(0,194,168,0) 70%),
      radial-gradient(520px 360px at 88% 18%, rgba(0,194,168,0.12), rgba(0,194,168,0) 72%),
      linear-gradient(135deg, #0B1116 0%, #101820 46%, #16222B 72%, #0B1116 100%);
    font-family: "Segoe UI", Arial, sans-serif;
    color: #F7F8FA;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(90deg, transparent 0%, black 30%, black 100%);
  }

  /* Left: a tilted game card with the app mark floating over it. */
  .stack { position: absolute; left: 70px; top: 72px; width: 232px; height: 352px; transform: rotate(-7deg); }
  .card-back {
    position: absolute; inset: 0; border-radius: 30px;
    background: linear-gradient(160deg, rgba(255,255,255,0.20), rgba(255,255,255,0.06));
    transform: translate(18px, 16px);
    box-shadow: 0 28px 70px rgba(0,0,0,0.45);
  }
  .card {
    position: absolute; inset: 0; border-radius: 30px;
    background: linear-gradient(180deg, #FFFFFF 0%, #F2F0EB 100%);
    box-shadow: 0 26px 64px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,255,255,0.9);
    overflow: hidden;
  }
  .card .kicker {
    position: absolute; top: 30px; left: 0; right: 0; text-align: center;
    font-size: 14px; font-weight: 700; letter-spacing: 3.2px; color: #8B9AA5;
  }
  .card .number {
    position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-53%);
    text-align: center; font-size: 132px; line-height: 1; font-weight: 900;
    letter-spacing: -2px; color: #101820;
  }
  .card .hints {
    position: absolute; left: 24px; right: 24px; bottom: 28px;
    display: flex; justify-content: space-between;
    font-size: 12px; font-weight: 800; letter-spacing: 1.1px;
  }
  .card .hints .no { color: #FF7A90; }
  .card .hints .yes { color: #009E8B; }

  .mark {
    position: absolute; left: 246px; top: 34px; width: 104px; height: 104px;
    border-radius: 24px; transform: rotate(8deg);
    box-shadow: 0 18px 44px rgba(0,194,168,0.34), 0 4px 12px rgba(0,0,0,0.35);
  }

  /* Right: wordmark and promise. */
  .copy { position: absolute; left: 402px; top: 84px; width: 570px; }
  .eyebrow {
    font-size: 18px; font-weight: 700; letter-spacing: 4.2px;
    color: #4FE3CF; text-transform: uppercase; margin-bottom: 12px;
  }
  h1 {
    margin: 0; font-size: 82px; line-height: 0.92; font-weight: 900;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  h1 .accent { color: #00C2A8; }
  .rule { width: 132px; height: 7px; background: #00C2A8; border-radius: 4px; margin: 22px 0 18px; }
  .tag { font-size: 25px; line-height: 1.32; color: #C7D3DB; max-width: 560px; }
  .tag b { color: #FFFFFF; font-weight: 700; }
  .sub { margin-top: 10px; font-size: 20px; line-height: 1.3; color: #9FB0BC; }
  .chip {
    display: inline-block; margin-top: 22px; padding: 10px 19px;
    border: 1px solid rgba(0,194,168,0.70); border-radius: 999px;
    color: #9FF0E4; font-size: 15px; font-weight: 800; letter-spacing: 2.4px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="stack">
    <div class="card-back"></div>
    <div class="card">
      <div class="kicker">IS THIS PRIME?</div>
      <div class="number">17</div>
      <div class="hints"><span class="no">&#8592; NOT PRIME</span><span class="yes">PRIME &#8594;</span></div>
    </div>
  </div>
  <img class="mark" src="icon-source.svg" alt="">

  <div class="copy">
    <div class="eyebrow">Spot the prime &middot; beat the clock</div>
    <h1>Prime<br><span class="accent">or Not</span></h1>
    <div class="rule"></div>
    <div class="tag">Swipe <b>right for prime</b>, <b>left for not prime</b>.</div>
    <div class="sub">Five seconds a card. How long can you last?</div>
    <div class="chip">Play Classic</div>
  </div>
</body>
</html>
